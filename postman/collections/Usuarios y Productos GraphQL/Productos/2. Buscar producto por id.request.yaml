$kind: http-request
description: Busca un producto existente por id.
url: "{{baseUrl}}/graphql"
method: POST
body:
  type: graphql
  content:
    query: "query GetProduct($id: ID!) {\r

      \  product(id: $id) {\r

      \    id\r

      \    name\r

      \    description\r

      \    price\r

      \    stock\r

      \  }\r

      }"
    variables: "{\r\n  \"id\": \"1\"\r\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('La respuesta HTTP es exitosa', () => {
        pm.response.to.have.status(200);
      });
      pm.test('No contiene errores GraphQL', () => {
        const body = pm.response.json();
        pm.expect(body.errors).to.equal(undefined);
      });
      pm.test('El producto existe', () => {
        const body = pm.response.json();
        pm.expect(body.data.product).to.not.equal(null);
      });
    language: text/javascript
order: 2000
