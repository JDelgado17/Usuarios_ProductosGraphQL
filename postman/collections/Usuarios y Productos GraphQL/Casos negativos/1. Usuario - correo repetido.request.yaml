$kind: http-request
description: El correo ana@example.com ya existe (dato semilla de database.sql). Debe fallar por restriccion UNIQUE.
url: "{{baseUrl}}/graphql"
method: POST
body:
  type: graphql
  content:
    query: "mutation CreateUser($input: UserInput!) {\r

      \  createUser(input: $input) {\r

      \    id\r

      \    name\r

      \    email\r

      \  }\r

      }"
    variables: "{\r

      \  \"input\": {\r

      \    \"name\": \"Otro usuario\",\r

      \    \"email\": \"ana@example.com\"\r

      \  }\r

      }"
scripts:
  - type: afterResponse
    code: |-
      pm.test('La operacion responde con errors', () => {
        const body = pm.response.json();
        pm.expect(body.errors).to.exist;
      });
    language: text/javascript
order: 1000
